# Bot de WhatsApp en producción (ADR 0018): n8n + Evolution API junto a docker-compose.produccion.yml.
#
#   docker compose -f docker-compose.produccion.yml -f docker-compose.produccion-bot.yml up -d --build
#   (o poner COMPOSE_FILE=docker-compose.produccion.yml:docker-compose.produccion-bot.yml en el .env del servidor)
#
# n8n y Evolution NO se publican a internet: sus puertos quedan ligados a 127.0.0.1 del servidor y se usan
# por túnel SSH (ssh -L 5678:127.0.0.1:5678 -L 8082:127.0.0.1:8082 goltime@servidor). Entre sí y con la API
# se hablan por la red interna de Docker. Guía: docs/despliegue-whatsapp.md.
services:
  api:
    environment:
      WHATSAPP_CLAVE_INTEGRACION: ${WHATSAPP_CLAVE_INTEGRACION:?Define WHATSAPP_CLAVE_INTEGRACION en .env}
      WHATSAPP_URL_AVISOS: http://n8n:5678/webhook/goltime-avisos
      WHATSAPP_SECRETO_AVISOS: ${WHATSAPP_SECRETO_AVISOS:?Define WHATSAPP_SECRETO_AVISOS en .env}

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # No cambiarla una vez creadas credenciales: dejarían de poder descifrarse.
      N8N_ENCRYPTION_KEY: ${N8N_CLAVE_CIFRADO:?Define N8N_CLAVE_CIFRADO en .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://n8n:5678/
      # Se entra por túnel a http://localhost:5678, sin HTTPS: la cookie segura no se enviaría.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GOLTIME_SECRETO_AVISOS: ${WHATSAPP_SECRETO_AVISOS}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
    volumes:
      - datos_n8n:/home/node/.n8n
    depends_on:
      - api
      - evolution-api

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_CLAVE:?Define EVOLUTION_DB_CLAVE en .env}
    volumes:
      - datos_evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_CLAVE_API:?Define EVOLUTION_CLAVE_API en .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_CLAVE}@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: goltime
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: Goltime
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      LANGUAGE: es
      LOG_LEVEL: ERROR,WARN,INFO
      TZ: America/Bogota
    volumes:
      - datos_evolution_instancias:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy

volumes:
  datos_n8n:
  datos_evolution_db:
  datos_evolution_instancias:
