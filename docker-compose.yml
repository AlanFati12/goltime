# Goltime: base de datos, API, web (Nginx + React) y Mailpit (correo de desarrollo).
# Uso: copiar .env.example a .env y ejecutar `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-goltime}
      POSTGRES_USER: ${DB_USUARIO:-goltime}
      POSTGRES_PASSWORD: ${DB_CLAVE:?Define DB_CLAVE en .env}
      TZ: UTC
    # Deja en el registro de la base toda sentencia que tarde más de 250 ms.
    command: ["postgres", "-c", "log_min_duration_statement=250"]
    volumes:
      - datos_db:/var/lib/postgresql/data
    ports:
      - "${DB_PUERTO_LOCAL:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO:-goltime} -d ${DB_NOMBRE:-goltime}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Visor de trazas (opcional): docker compose --profile observabilidad up -d  →  http://localhost:16686
  trazas:
    profiles: ["observabilidad"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # interfaz web para ver los correos
      - "1025:1025" # SMTP

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-dev}
      DB_URL: jdbc:postgresql://db:5432/${DB_NOMBRE:-goltime}
      DB_USUARIO: ${DB_USUARIO:-goltime}
      DB_CLAVE: ${DB_CLAVE}
      JWT_SECRETO: ${JWT_SECRETO:?Define JWT_SECRETO (mínimo 32 caracteres) en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:8081,http://localhost:5173}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-false}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      # Ingreso con Google (ADR 0023). En local, GOOGLE_MODO_PRUEBA=true deja entrar sin Google (solo desarrollo).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_MODO_PRUEBA: ${GOOGLE_MODO_PRUEBA:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_AUTENTICACION: ${SMTP_AUTENTICACION:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-responder@goltime.local}
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8081}
      # Trazas de rendimiento (opcional): OTEL_ACTIVADO=true y `docker compose --profile observabilidad up -d`.
      OTEL_ACTIVADO: ${OTEL_ACTIVADO:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://trazas:4318/v1/traces}
      TZ: UTC
    volumes:
      - datos_archivos:/app/uploads
    ports:
      - "8080:8080" # Swagger UI en desarrollo: http://localhost:8080/swagger-ui.html

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PUERTO:-8081}:80"

  # Datos de demostración (opcional): docker compose --profile demo run --rm demo
  demo:
    profiles: ["demo"]
    build: ./scripts/demo
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080/api/v1
      ADMIN_CORREO: ${ADMIN_CORREO:?Define ADMIN_CORREO en .env}
      DB_HOST: db
      DB_PUERTO: 5432
      DB_NOMBRE: ${DB_NOMBRE:-goltime}
      DB_USUARIO: ${DB_USUARIO:-goltime}
      DB_CLAVE: ${DB_CLAVE}

volumes:
  datos_db:
  datos_archivos:
