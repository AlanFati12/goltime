# Goltime en producción (VPS): Caddy (HTTPS automático) → Nginx (web) → API → PostgreSQL.
# Solo Caddy publica puertos (80 y 443); base de datos, API y web quedan en la red interna.
# Uso: cp .env.produccion.example .env  →  editar  →  docker compose -f docker-compose.produccion.yml up -d --build
# Guía completa: docs/despliegue-vps.md
name: goltime
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-goltime}
      POSTGRES_USER: ${DB_USUARIO:-goltime}
      POSTGRES_PASSWORD: ${DB_CLAVE:?Define DB_CLAVE en .env}
      TZ: UTC
    # Deja en el registro de la base toda sentencia que tarde más de 250 ms.
    command: ["postgres", "-c", "log_min_duration_statement=250"]
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO:-goltime} -d ${DB_NOMBRE:-goltime}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NOMBRE:-goltime}
      DB_USUARIO: ${DB_USUARIO:-goltime}
      DB_CLAVE: ${DB_CLAVE}
      JWT_SECRETO: ${JWT_SECRETO:?Define JWT_SECRETO (mínimo 32 caracteres) en .env}
      CORS_ORIGENES: https://${DOMINIO:?Define DOMINIO en .env}
      COOKIE_SEGURA: "true"
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST en .env (correo real)}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_AUTENTICACION: ${SMTP_AUTENTICACION:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CORREO_REMITENTE: ${CORREO_REMITENTE:?Define CORREO_REMITENTE en .env}
      URL_PUBLICA: https://${DOMINIO}
      VERIFICACION_CORREO_OBLIGATORIA: ${VERIFICACION_CORREO_OBLIGATORIA:-false}
      # Trazas (opcional): apuntar OTEL_EXPORTER_OTLP_ENDPOINT a un colector propio y poner OTEL_ACTIVADO=true.
      OTEL_ACTIVADO: ${OTEL_ACTIVADO:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
      TZ: UTC
    volumes:
      - datos_archivos:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
      - config_caddy:/config

  # Datos de demostración (opcional, base vacía):
  #   docker compose -f docker-compose.produccion.yml --profile demo up demo
  demo:
    profiles: ["demo"]
    build: ./scripts/demo
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080/api/v1
      ADMIN_CORREO: ${ADMIN_CORREO:?Define ADMIN_CORREO en .env}
      ADMIN_CLAVE: ${ADMIN_CLAVE:?Define ADMIN_CLAVE en .env}
      DEMO_CLAVE_CLIENTES: ${DEMO_CLAVE_CLIENTES:-Demo2026*}
      DB_HOST: db
      DB_PUERTO: 5432
      DB_NOMBRE: ${DB_NOMBRE:-goltime}
      DB_USUARIO: ${DB_USUARIO:-goltime}
      DB_CLAVE: ${DB_CLAVE}

volumes:
  datos_db:
  datos_archivos:
  datos_caddy:
  config_caddy:
