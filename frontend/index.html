<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Goltime: reserva canchas sintéticas en Neiva, sigue torneos y gana premios." />
    <title>Goltime · Fútbol sintético en Neiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="/arranque.js"></script>
    <style>
      /* Pantalla de arranque: se pinta antes de que cargue la aplicación y main.tsx la retira. */
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 38%, #16213a 0%, #0b1220 62%);
        color: #fff;
        transition:
          opacity 520ms cubic-bezier(0.23, 1, 0.32, 1),
          visibility 520ms;
      }
      #arranque.salida {
        opacity: 0;
        visibility: hidden;
      }
      #arranque .marca {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #arranque svg {
        width: 76px;
        height: 76px;
        overflow: visible;
      }
      #arranque .circulo {
        stroke-dasharray: 54;
        stroke-dashoffset: 54;
        animation: trazo 900ms cubic-bezier(0.77, 0, 0.175, 1) 80ms forwards;
      }
      #arranque .aguja {
        transform-origin: 16px 16px;
        animation: aguja 1600ms cubic-bezier(0.77, 0, 0.175, 1) infinite;
      }
      #arranque .luz {
        position: absolute;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(132 204 22 / 0.22), transparent 65%);
        animation: pulso 2.2s ease-in-out infinite;
      }
      #arranque .nombre {
        font: 800 30px/1 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(8px);
        animation: aparecer 600ms cubic-bezier(0.23, 1, 0.32, 1) 350ms forwards;
      }
      #arranque .nombre span {
        color: #a3e635;
      }
      @keyframes trazo {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes aguja {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulso {
        50% {
          transform: scale(1.12);
          opacity: 0.7;
        }
      }
      @keyframes aparecer {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #arranque *,
        #arranque .circulo {
          animation: none !important;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="arranque" role="status" aria-label="Cargando Goltime">
      <div class="luz" aria-hidden="true"></div>
      <div class="marca" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 1.5v6M16 24.5v6" stroke="#84cc16" stroke-width="1.6" stroke-linecap="round" opacity=".45" />
          <circle class="circulo" cx="16" cy="16" r="8.5" stroke="#84cc16" stroke-width="2.2" />
          <path class="aguja" d="M16 16V10.6" stroke="#a3e635" stroke-width="2.2" stroke-linecap="round" />
          <path d="M16 16l3.4 2.2" stroke="#a3e635" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="16" cy="16" r="1.7" fill="#a3e635" />
        </svg>
        <div class="nombre">Gol<span>time</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
