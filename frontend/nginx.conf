# Si hay un proxy HTTPS delante (Caddy en el VPS), respeta el esquema que él informa.
map $http_x_forwarded_proto $esquema_cliente {
    default $scheme;
    https   https;
}

# Conexiones persistentes hacia la API: evita abrir una conexión TCP nueva por cada petición.
upstream api_goltime {
    server api:8080;
    keepalive 16;
}

# Compresión de texto (JS, CSS, JSON, SVG). Las imágenes WebP ya vienen comprimidas.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/cabeceras-seguridad.inc;

    # La API vive en otro contenedor; el navegador la ve como el mismo origen (sin CORS en producción).
    location /api/ {
        include /etc/nginx/cabeceras-seguridad.inc;
        proxy_pass http://api_goltime;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_cliente;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Archivos con hash en el nombre (JS, CSS, fuentes): caché de un año, nunca cambian.
    location /assets/ {
        include /etc/nginx/cabeceras-seguridad.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Imágenes del sitio: no llevan hash en el nombre, así que 30 días y se revalidan con ETag.
    # Si se reemplaza una, conviene darle otro nombre.
    location /img/ {
        include /etc/nginx/cabeceras-seguridad.inc;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # SPA: cualquier ruta del front devuelve index.html, que siempre se revalida para ver versiones nuevas.
    location / {
        include /etc/nginx/cabeceras-seguridad.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
