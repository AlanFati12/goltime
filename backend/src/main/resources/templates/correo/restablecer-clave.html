<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body style="font-family: Arial, sans-serif; background:#f8fafc; padding:24px; color:#0f172a;">
  <div style="max-width:520px; margin:auto; background:#ffffff; border-radius:12px; padding:24px; border:1px solid #e2e8f0;">
    <h2 style="color:#166534; margin-top:0;">Goltime</h2>
    <p>Hola <strong th:text="${nombre}">Cliente</strong>,</p>
    <p>Recibimos una solicitud para restablecer tu contraseña.</p>
    <p><a th:href="${enlace}" style="display:inline-block; background:#16a34a; color:#ffffff; padding:12px 20px; border-radius:8px; text-decoration:none;">Crear una contraseña nueva</a></p>
    <p style="font-size:13px; color:#475569;">El enlace es de un solo uso y vence en 30 minutos. Si no fuiste tú, ignora este mensaje: tu contraseña no cambiará.</p>
  </div>
</body>
</html>
