spring:
  datasource:
    hikari:
      # En pruebas hay muchas peticiones concurrentes y la máquina puede ir cargada: holgura para no fallar por el pool.
      maximum-pool-size: 20
      connection-timeout: 30000

goltime:
  reservas:
    intervalo-tareas-ms: 3600000
  limite-tasa:
    ingreso-por-minuto: 100000
  seguridad:
    jwt-secreto: secreto-solo-para-pruebas-automaticas-0123456789
    cookie-segura: false
  almacenamiento:
    directorio: target/uploads-pruebas
  swagger:
    habilitado: true
  whatsapp:
    clave-integracion: clave-de-integracion-solo-para-pruebas-0123456789
  administrador-inicial:
    correo: admin-pruebas@goltime.test
  google:
    modo-prueba: true
